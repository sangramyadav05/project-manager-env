[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-manager-environment"
version = "1.1.0"
description = "OpenEnv-compatible project management environment with FastAPI, grader, and inference client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "requests==2.32.3",
  "openai==1.51.0",
  "openenv-core>=0.2.0",
]

[project.scripts]
server = "server:main"

[tool.setuptools]
py-modules = ["app", "env", "grader", "inference", "models", "server"]
